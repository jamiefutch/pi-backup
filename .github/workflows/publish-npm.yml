name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets npm trusted publishing (OIDC) authenticate without a token
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag v$tag_version does not match package.json version $package_version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check the package contents
        run: npm pack --dry-run

      - name: Check npm authentication is configured
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::The NPM_TOKEN secret is empty. Publishing only works if this package has npm trusted publishing configured for this workflow."
          fi

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Use a current npm
        run: npm install -g npm@^11.5.1

      - name: Publish package
        run: npm publish --access public
        env:
          # Empty when the secret is unset; npm then falls back to trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
